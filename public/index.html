<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #4a703b; color: white; font-family: sans-serif; overflow: hidden; }

        /* Title Screen */
        #titleScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .clan-btn { padding: 20px; margin: 10px; width: 200px; cursor: pointer; border: none; font-weight: bold; color: white; border-radius: 5px; }

        /* HUD */
        #hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; pointer-events: none; }
        #hotbar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; }
        .slot { width: 50px; height: 50px; border: 2px solid #fff; background: #333; display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center; }

        /* Crafting */
        #craftMenu { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; }
        button { cursor: pointer; display: block; width: 100%; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="titleScreen">
        <h1>Select Your Clan</h1>
        <button class="clan-btn" style="background: #e74c3c;" onclick="join('red')">RED CLAN</button>
        <button class="clan-btn" style="background: #3498db;" onclick="join('blue')">BLUE CLAN</button>
        <button class="clan-btn" style="background: #2ecc71;" onclick="join('green')">GREEN CLAN</button>
        <button class="clan-btn" style="background: #f1c40f; color: black;" onclick="join('yellow')">YELLOW CLAN</button>
    </div>

    <div id="hud">
        Clan: <span id="clanName">-</span> | Age: <span id="ageVal">0</span><br>
        Stamina: <span id="stamVal">100</span>
    </div>

    <div id="craftMenu">
        <b>Crafting</b>
        <button onclick="socket.emit('craft', 'spear')">Spear (4 Sticks)</button>
        <button onclick="socket.emit('craft', 'table')">Craft Table (10 Logs)</button>
    </div>

    <div id="hotbar">
        <div class="slot">Log<br><span id="h-logs">0</span></div>
        <div class="slot">Stick<br><span id="h-sticks">0</span></div>
        <div class="slot">Stone<br><span id="h-stones">0</span></div>
        <div class="slot">Spear<br><span id="h-spears">0</span></div>
        <div class="slot">Table<br><span id="h-tables">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let myId, players = {}, worldObjects = [];
        const keys = {};

        function join(clan) {
            document.getElementById('titleScreen').style.display = 'none';
            socket.emit('joinGame', { clan: clan });
        }

        socket.on('init', data => {
            players = data.players;
            worldObjects = data.worldObjects;
            myId = data.myId;
            document.getElementById('clanName').innerText = players[myId].clan.toUpperCase();
        });

        socket.on('newPlayer', p => players[p.id] = p);
        socket.on('tick', serverPlayers => {
            players = serverPlayers;
            const me = players[myId];
            if(me) {
                document.getElementById('ageVal').innerText = Math.floor(me.age);
                document.getElementById('stamVal').innerText = me.stamina;
                document.getElementById('h-logs').innerText = me.inventory.logs;
                document.getElementById('h-sticks').innerText = me.inventory.sticks;
                document.getElementById('h-stones').innerText = me.inventory.stones;
                document.getElementById('h-spears').innerText = me.inventory.spears;
                document.getElementById('h-tables').innerText = me.inventory.tables;
            }
        });

        // (Previous movement and drawing logic remains same, but using p.color for clan color)
        function draw() {
            if(!myId || !players[myId]) return requestAnimationFrame(draw);
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            ctx.clearRect(0,0,canvas.width, canvas.height);

            const me = players[myId];
            if(window.onkeydown) /* movement keys logic here */

            const cx = me.x - canvas.width/2;
            const cy = me.y - canvas.height/2;

            worldObjects.forEach(o => {
                ctx.fillStyle = o.type === 'tree' ? '#224422' : '#666';
                ctx.beginPath(); ctx.arc(o.x - cx, o.y - cy, 20, 0, Math.PI*2); ctx.fill();
            });

            for(let id in players) {
                let p = players[id];
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x - cx, p.y - cy, 20, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "white";
                ctx.fillText(`Age ${Math.floor(p.age)}`, p.x - cx - 15, p.y - cy - 30);
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
