<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #4a703b; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        #titleScreen { position: fixed; inset: 0; background: radial-gradient(circle, #222, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .clan-btn { padding: 15px; margin: 10px; width: 220px; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; font-weight: bold; transition: 0.2s; }
        .clan-btn:hover { transform: scale(1.05); border-color: white; }
        
        #hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 12px; border: 1px solid #555; pointer-events: none; }
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 15px; border: 2px solid #444; }
        .slot { width: 60px; height: 60px; background: #222; border: 2px solid #555; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; }
        .slot.active { border-color: #fff; box-shadow: 0 0 10px #fff; }
    </style>
</head>
<body>
    <div id="titleScreen">
        <h1 style="font-size: 48px; letter-spacing: 5px;">YMAY</h1>
        <p>Civilization & Lineage</p>
        <button class="clan-btn" style="background:#e74c3c" onclick="join('red')">RED CLAN</button>
        <button class="clan-btn" style="background:#3498db" onclick="join('blue')">BLUE CLAN</button>
    </div>

    <div id="hud">
        <div style="font-size: 18px; font-weight: bold;" id="clanDisplay">CLAN</div>
        <div style="color: #aaa;">Age: <span id="ageVal">0</span></div>
        <div style="width: 150px; height: 8px; background: #333; margin-top: 10px; border-radius: 4px; overflow: hidden;">
            <div id="stamBar" style="width: 100%; height: 100%; background: #f1c40f; transition: 0.3s;"></div>
        </div>
    </div>
    
    <div id="hotbar">
        <div class="slot active">Rock<br><span id="h-rocks">1</span></div>
        <div class="slot">Log<br><span id="h-logs">0</span></div>
        <div class="slot">Stick<br><span id="h-sticks">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let myId, players = {}, worldObjects = [];
        let animOffset = { x: 0, y: 0 };
        const keys = {};

        function join(c) {
            document.getElementById('titleScreen').style.display = 'none';
            document.getElementById('clanDisplay').innerText = c.toUpperCase() + " CLAN";
            socket.emit('joinGame', { clan: c });
        }

        window.onkeydown = e => keys[e.key.toLowerCase()] = true;
        window.onkeyup = e => keys[e.key.toLowerCase()] = false;

        socket.on('init', data => { players = data.players; worldObjects = data.worldObjects; myId = data.myId; });
        socket.on('tick', sPlayers => {
            players = sPlayers;
            if(players[myId]) {
                document.getElementById('ageVal').innerText = Math.floor(players[myId].age);
                document.getElementById('stamBar').style.width = players[myId].stamina + "%";
                document.getElementById('h-rocks').innerText = players[myId].inventory.rocks;
                document.getElementById('h-logs').innerText = players[myId].inventory.logs;
                document.getElementById('h-sticks').innerText = players[myId].inventory.sticks;
            }
        });

        socket.on('removeObject', id => { worldObjects = worldObjects.filter(o => o.id !== id); });

        canvas.onmousedown = (e) => {
            if(!players[myId]) return;
            const cx = players[myId].x - canvas.width/2;
            const cy = players[myId].y - canvas.height/2;
            const mx = e.clientX + cx;
            const my = e.clientY + cy;

            // Trigger "Punch" Animation
            const angle = Math.atan2(my - players[myId].y, mx - players[myId].x);
            animOffset.x = Math.cos(angle) * 15;
            animOffset.y = Math.sin(angle) * 15;
            setTimeout(() => { animOffset = {x:0, y:0}; }, 150);

            worldObjects.forEach(o => {
                if(Math.hypot(o.x - mx, o.y - my) < o.size + 10) socket.emit('action', o.id);
            });
        };

        function draw() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            if(!myId || !players[myId]) return requestAnimationFrame(draw);
            
            const me = players[myId];
            if(keys['w']) me.y -= 4.5; if(keys['s']) me.y += 4.5;
            if(keys['a']) me.x -= 4.5; if(keys['d']) me.x += 4.5;
            socket.emit('playerMovement', {x: me.x, y: me.y});

            const camX = me.x - canvas.width/2;
            const camY = me.y - canvas.height/2;

            // Draw Map Background Grid
            ctx.strokeStyle = "rgba(0,0,0,0.1)";
            for(let x = -camX % 100; x < canvas.width; x += 100) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for(let y = -camY % 100; y < canvas.height; y += 100) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            // Draw Objects
            worldObjects.forEach(o => {
                ctx.fillStyle = "rgba(0,0,0,0.2)"; // Shadow
                ctx.beginPath(); ctx.arc(o.x - camX + 5, o.y - camY + 5, o.size, 0, 7); ctx.fill();
                ctx.fillStyle = o.type === 'tree' ? '#2d5a27' : '#7f8c8d';
                ctx.beginPath(); ctx.arc(o.x - camX, o.y - camY, o.size, 0, 7); ctx.fill();
            });

            // Draw Players
            for(let id in players) {
                let p = players[id];
                let px = p.x - camX;
                let py = p.y - camY;
                
                if(id === myId) { px += animOffset.x; py += animOffset.y; }

                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(px, py, 18, 0, 7); ctx.fill();
                ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.stroke();
                
                ctx.fillStyle = "white"; ctx.textAlign = "center";
                ctx.fillText(`Lv. ${Math.floor(p.age)}`, px, py - 30);
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
